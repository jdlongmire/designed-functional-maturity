name: repo-checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Repository checks
        run: python scripts/check_repo.py
